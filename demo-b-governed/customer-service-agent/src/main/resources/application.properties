# ---------------------------------------------------------------------------
# DEMO B - salto 1: customer-service-agent
# ---------------------------------------------------------------------------
spring.application.name=customer-service-agent
server.port=8081

a2a.agent.url=http://localhost:8081/

# Registry CURADO. Nao ha descoberta dinamica: esta URL e a unica com quem este agente fala.
governance.registry.credit-agent-url=http://localhost:8082/

# Segredos de demo. Em producao: IdP real (RFC 8693) e PKI real, nunca segredo compartilhado.
governance.token.issuer=demo-idp
governance.token.secret=${GOVERNANCE_TOKEN_SECRET:demo-token-secret-com-32-bytes-ou-mais!!}
governance.token.ttl-seconds=60
governance.card.secret=${GOVERNANCE_CARD_SECRET:demo-card-secret-com-32-bytes-ou-mais!!!}
governance.card.key-id=demo-card-key

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model-id=${OLLAMA_MODEL_ID:llama3.2}
ollama.timeout-seconds=120

logging.pattern.console=%-5level %msg%n
logging.level.br.com.talk.a2a=INFO
