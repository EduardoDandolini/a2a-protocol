# ---------------------------------------------------------------------------
# DEMO A - agente ingenuo
# ---------------------------------------------------------------------------
spring.application.name=demo-a-naive-agent
server.port=8080

# Agent Card publicado em http://localhost:8080/.well-known/agent-card.json
a2a.agent.url=http://localhost:8080/

# Ollama local. Rode antes:  ollama serve  &&  ollama pull llama3.2
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model-id=${OLLAMA_MODEL_ID:llama3.2}
ollama.timeout-seconds=120

logging.pattern.console=%-5level %msg%n
logging.level.br.com.talk.a2a=INFO
